<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гача: Кристальный алтарь</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #15121f; --panel: #201b30; --line: #352d4d; --text: #ece8f7; --mute: #9a92b5;
    --btn: #6d4cff; --btn2: #ff4d6d; --inp: #15121f;
    --c0: #9aa0ad; --c1: #5fd068; --c2: #4a9dff; --c3: #b25cff;
    --c4: #ffb02e; --c5: #ff4f6d; --c6: #1ee3cf; --c7: #ffe98a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 "Trebuchet MS", "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font: 700 26px/1.1 Georgia, "Times New Roman", serif; margin: 4px 0 14px; letter-spacing: .5px; }
  h2 { font-size: 17px; margin: 22px 0 8px; }

  .top { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .stat small { color: var(--mute); display: block; }
  .stat b { font-size: 20px; overflow-wrap: anywhere; }

  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: center; }
  #card { min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center;
          border: 2px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; transition: box-shadow .3s; }
  #card .em { font-size: 56px; line-height: 1; }
  #card .nm { font-weight: 700; font-size: 20px; margin-top: 6px; }
  #card .rr { font-size: 14px; }
  #card.pop { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); opacity: .3; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #card.pop { animation: none; } }

  .row { display: flex; gap: 10px; margin-top: 10px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 12px 14px; background: var(--btn); color: #fff; cursor: pointer; flex: 1; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--c4); outline-offset: 2px; }
  button.alt { background: transparent; color: var(--text); border: 1px solid var(--line); }
  input, select { font: inherit; flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--inp); color: var(--text); }

  #log { max-height: 130px; overflow: auto; font-size: 14px; margin-top: 12px; text-align: left; }
  #log div { padding: 1px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--mute); font-weight: 400; }
  td:nth-child(n+2), th:nth-child(n+2) { text-align: right; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .it { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 14px; }
  .it.off { opacity: .35; }
  .it .e { font-size: 24px; }
  #adminBox { margin-top: 12px; text-align: left; display: none; }
</style>
</head>
<body>
<main>
  <h1>Кристальный алтарь</h1>

  <div class="top">
    <div class="stat"><small>Монеты</small><b id="coins">0</b></div>
    <div class="stat"><small>Удача</small><b id="lucklv">0</b></div>
    <div class="stat"><small>Броски</small><b id="rolls">0</b></div>
  </div>
  <div class="stat" style="margin-bottom:14px"><small>Лучшая редкость (рекорд)</small><b id="best">—</b></div>

  <div class="stage">
    <div id="card">
      <div class="em">🔮</div>
      <div class="nm">Сделай первый бросок</div>
      <div class="rr" style="color:var(--mute)">+3 монеты каждую секунду</div>
    </div>
    <div class="row"><button id="r1">Бросок · 10</button><button id="r10">×10 · 100</button></div>
    <div class="row"><button class="alt" id="luck"></button></div>
    <div id="log"></div>
  </div>

  <h2>Шансы (с учётом удачи)</h2>
  <table id="odds"></table>

  <h2>Коллекция <span id="colcount" style="color:var(--mute);font-weight:400"></span></h2>
  <div class="grid" id="col"></div>

  <!-- ПАНЕЛЬКА СНИЗУ -->
  <div class="row" style="margin-top:22px">
    <button class="alt" id="reset">Сбросить прогресс</button>
    <button class="alt" id="adm">Админ</button>
  </div>
  <div id="adminBox" class="stage">
    <b>Админ-панель</b>
    <div class="row"><input id="a_coins" type="number" value="1000"><button id="a_give">Выдать монеты</button></div>
    <div class="row"><input id="a_luck" type="number" value="10"><button id="a_setluck">Задать уровень удачи</button></div>
    <div class="row"><select id="a_rar"></select><button id="a_item">Выдать предмет</button></div>
    <div class="row"><button class="alt" id="a_all">Открыть всю коллекцию</button></div>
  </div>
</main>

<script>
/* ==========================================================================================
   НАСТРОЙКИ (меняйте только текст в кавычках и цифры)
   ==========================================================================================
   ADMIN_PASS — пароль админ-панели (кнопка «Админ» внизу).
   INCOME     — монет в секунду.
   (Лимита уровня удачи больше нет — качай сколько хочешь.)
   RARITIES   — редкости. chance — шанс в %, у первой (Common) пишите 0: она берёт остаток до 100%.
                coins — награда монетами за предмет. items — предметы ["эмодзи", "название"].
                Новую редкость вставляйте в КОНЕЦ списка (после Divine), не забыв запятую.
   ========================================================================================== */
const ADMIN_PASS = "admin123";
const INCOME     = 3;

const RARITIES = [
  { name: "Common",    ru: "Обычный",      chance: 0,      coins: 2,     color: "var(--c0)",
    items: [["🪨", "Камень"], ["🍂", "Лист"], ["🥄", "Ложка"], ["🧦", "Носок"]] },
  { name: "Uncommon",  ru: "Необычный",    chance: 28.5,   coins: 4,     color: "var(--c1)",
    items: [["🍀", "Клевер"], ["🗝️", "Ключ"], ["🕯️", "Свеча"], ["🧪", "Зелье"]] },
  { name: "Rare",      ru: "Редкий",       chance: 17.5,   coins: 10,    color: "var(--c2)",
    items: [["💎", "Сапфир"], ["🛡️", "Щит"], ["📜", "Свиток"], ["🦉", "Сова"]] },
  { name: "Epic",      ru: "Эпический",    chance: 8.5,    coins: 30,    color: "var(--c3)",
    items: [["🔮", "Шар судьбы"], ["🗡️", "Клинок теней"], ["🦄", "Единорог"]] },
  { name: "Legendary", ru: "Легендарный",  chance: 1,      coins: 120,   color: "var(--c4)",
    items: [["👑", "Корона королей"], ["🐉", "Дракон"], ["⚡", "Молния Зевса"]] },
  { name: "Mythic",    ru: "Мифический",   chance: 0.05,   coins: 500,   color: "var(--c5)",
    items: [["🔥", "Феникс"], ["🌌", "Осколок галактики"], ["🐙", "Кракен"]] },
  { name: "Secret",    ru: "Секретный",    chance: 0.004,  coins: 2500,  color: "var(--c6)",
    items: [["🕳️", "Чёрная дыра"], ["🎭", "Маска незнакомца"], ["⌛", "Забытое время"]] },
  { name: "Divine",    ru: "Божественный", chance: 0.0004, coins: 12500, color: "var(--c7)",
    items: [["☀️", "Сердце солнца"], ["👁️", "Око вселенной"], ["✨", "Первая звезда"]] }
];
/* ===================== Дальше ничего менять не нужно ===================== */

/* Common получает всё, что осталось до 100% */
RARITIES[0].chance = +(100 - RARITIES.slice(1).reduce((a, r) => a + r.chance, 0)).toFixed(4);

const ALL = [];                       // плоский список предметов: {i: номер редкости, e: эмодзи, n: название, k: ключ сохранения}
RARITIES.forEach((r, i) => r.items.forEach(([e, n]) => ALL.push({ i, e, n, k: e + " " + n })));

const $ = id => document.getElementById(id);
const KEY = "gacha-retro-v1";
let S = { coins: 30, luck: 0, rolls: 0, found: {}, best: -1 };
let busy = false;

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* Красивые числа: до 10 000 — как есть, дальше 12.3K, а от миллиона — всё в миллионах:
   3.4m, 250.0m, ... 7000000000m (без сокращений Sx, Qd и т.п.) */
function fmt(n) {
  if (!isFinite(n)) return "∞";
  if (n < 1e4) return Math.floor(n).toString();
  if (n < 999950) return (n / 1e3).toFixed(1) + "K";
  const m = n / 1e6;
  if (m < 99.95) return m.toFixed(1) + "m";
  return BigInt(Math.round(m)).toString() + "m";   // BigInt — чтобы большие числа не превращались в 1e+21
}

const luckCost = () => Math.floor(60 * Math.pow(1.6, S.luck));
const weights = () => { const m = 1 + S.luck * 0.07; return RARITIES.map((r, i) => r.chance * Math.pow(m, i)); };
const fmtP = p => p >= 1 ? p.toFixed(1) + "%" : p >= 0.1 ? p.toFixed(2) + "%" : "1 из " + fmt(Math.round(100 / p));

function pick() {
  const w = weights(), total = w.reduce((a, b) => a + b, 0);
  let x = Math.random() * total;
  for (let i = 0; i < w.length; i++) { if ((x -= w[i]) < 0) return i; }
  return 0;
}

function showCard(i, item, extra) {
  const c = $("card");
  c.innerHTML = `<div class="em">${item.e}</div><div class="nm">${item.n}</div>` +
                `<div class="rr" style="color:${RARITIES[i].color}">${RARITIES[i].ru}${extra ? " · " + extra : ""}</div>`;
  c.style.borderColor = RARITIES[i].color;
  c.style.boxShadow = `0 0 ${10 + i * 8}px ${RARITIES[i].color}`;
  c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
}

function roll(n) {
  const cost = 10 * n;
  if (busy || S.coins < cost) return;
  S.coins -= cost;
  let best = -1, bestItem = null, gain = 0;
  const lines = [];
  for (let k = 0; k < n; k++) {
    const i = pick(), pool = ALL.filter(a => a.i === i), item = pool[Math.floor(Math.random() * pool.length)];
    S.rolls++; S.found[item.k] = (S.found[item.k] || 0) + 1; gain += RARITIES[i].coins;
    if (i > best) { best = i; bestItem = item; }
    if (i > S.best) S.best = i;
    if (i >= 3) lines.push(`<div style="color:${RARITIES[i].color}">${RARITIES[i].ru}: ${item.e} ${item.n}</div>`);
  }
  S.coins += gain;
  showCard(best, bestItem, "+" + fmt(gain) + " монет");
  if (lines.length) $("log").innerHTML = lines.join("") + $("log").innerHTML;
  render(); save();
}

function render() {
  $("coins").textContent = fmt(S.coins);
  $("lucklv").textContent = S.luck;
  $("rolls").textContent = S.rolls;
  const b = $("best");
  if (S.best >= 0) { b.textContent = RARITIES[S.best].name + " · " + RARITIES[S.best].ru; b.style.color = RARITIES[S.best].color; }
  else { b.textContent = "—"; b.style.color = ""; }
  $("r1").disabled = S.coins < 10; $("r10").disabled = S.coins < 100;

  $("luck").textContent = `Прокачать удачу до ${S.luck + 1} · ${fmt(luckCost())}`;
  $("luck").disabled = S.coins < luckCost();

  const w = weights(), t = w.reduce((a, b) => a + b, 0);
  $("odds").innerHTML = "<tr><th>Редкость</th><th>Шанс</th><th>Награда</th></tr>" +
    RARITIES.map((r, i) => `<tr><td style="color:${r.color};font-weight:700">${r.name}</td><td>${fmtP(w[i] / t * 100)}</td><td>${fmt(r.coins)}</td></tr>`).join("");

  const got = ALL.filter(a => S.found[a.k]).length;
  $("colcount").textContent = `${got}/${ALL.length}`;
  $("col").innerHTML = ALL.map(a => {
    const n = S.found[a.k] || 0, r = RARITIES[a.i];
    return `<div class="it ${n ? "" : "off"}" style="border-color:${n ? r.color : "var(--line)"}">` +
           `<div class="e">${n ? a.e : "❔"}</div>${n ? a.n : "???"}` +
           `<div style="color:${r.color};font-size:12px">${r.ru}${n ? " ×" + n : ""}</div></div>`;
  }).join("");
}

$("r1").onclick = () => roll(1);
$("r10").onclick = () => roll(10);
$("luck").onclick = () => { const c = luckCost(); if (S.coins >= c) { S.coins -= c; S.luck++; render(); save(); } };
$("reset").onclick = () => {
  if (confirm("Удалить весь прогресс?")) { S = { coins: 30, luck: 0, rolls: 0, found: {}, best: -1 }; $("log").innerHTML = ""; save(); render(); }
};

/* ---------- админ-панель (внизу) ---------- */
$("a_rar").innerHTML = RARITIES.map((r, i) => `<option value="${i}">${r.name}</option>`).join("");
$("adm").onclick = () => {
  const box = $("adminBox");
  if (box.style.display === "block") { box.style.display = "none"; return; }
  if (prompt("Пароль админа") === ADMIN_PASS) box.style.display = "block";
};
$("a_give").onclick = () => { S.coins += Math.max(0, +$("a_coins").value || 0); render(); save(); };
$("a_setluck").onclick = () => { S.luck = Math.max(0, Math.floor(+$("a_luck").value || 0)); render(); save(); };
$("a_item").onclick = () => {
  const i = +$("a_rar").value, pool = ALL.filter(a => a.i === i), item = pool[Math.floor(Math.random() * pool.length)];
  S.found[item.k] = (S.found[item.k] || 0) + 1;
  if (i > S.best) S.best = i;
  showCard(i, item, "выдано админом"); render(); save();
};
$("a_all").onclick = () => { ALL.forEach(a => { if (!S.found[a.k]) S.found[a.k] = 1; }); S.best = RARITIES.length - 1; render(); save(); };

setInterval(() => { S.coins += INCOME; render(); save(); }, 1000);
render();
</script>
</body>
</html>
